# Deskflow server config (used via Settings: externalConfig=true / externalConfigFile=<this file>).
# Deskflow 1.27 reads SCREENS from the GUI's own config (Configure Server grid) and ignores a
# screens section here; links and options ARE read from this file.
#
# Hotkeys avoid Super: Cinnamon/Muffin grabs the keyboard while Super is held, so Deskflow never
# sees Super+X. The GUI also saves the Windows key as "Meta", which X11 can't map. Avoid
# Ctrl+Alt+Fn (switches Linux virtual terminals).
#
# Replace LINUX-SCREEN-NAME / MAC-SCREEN-NAME with the names Deskflow shows for each computer
# (the Mac's is usually its `hostname`, e.g. Mac-mini.localdomain).
section: links
	LINUX-SCREEN-NAME:
	MAC-SCREEN-NAME:
end

section: options
	keystroke(Control+Shift+F12) = switchToNextScreen
	keystroke(Control+Shift+F10) = switchToScreen(LINUX-SCREEN-NAME)
end
